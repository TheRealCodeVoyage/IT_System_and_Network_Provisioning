<!--
  Site-wide additions, injected into <head> of every page by the Slate theme.
  - Dark theme (default) with a light/dark toggle in the header.
  - A "Copy" button on every fenced code block.
-->
<script>
  // Set the theme before the page paints, so there is no light-mode flash.
  (function () {
    var theme = "dark";
    try { theme = localStorage.getItem("site-theme") || "dark"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  /* ---------------------------------------------------------------------
     Theme tokens
     --------------------------------------------------------------------- */
  :root {
    --content-bg: #f2f2f2;
    --text: #373737;
    --heading: #222222;
    --link: #0f79d0;
    --muted: #666666;
    --rule: #cfcfcf;
    --code-bg: #ffffff;
    --code-text: #222222;
    --code-border: transparent;
    --code-shadow: 0 0 10px rgba(0, 0, 0, .1);
    --table-border: #373737;
    --th-bg: #373737;
    --img-border: #ebebeb;

    --btn-text: #555555;
    --btn-bg: rgba(255, 255, 255, .92);
    --btn-border: #d8d8d8;
    --btn-hover-text: #222222;
    --btn-hover-bg: #ffffff;
    --btn-hover-border: #b5b5b5;
    --ok-text: #1a7f37;
    --ok-bg: #f0fff4;
    --ok-border: #8fd19e;
    --focus: #4183c4;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --content-bg: #17191d;
    --text: #d3d7dd;
    --heading: #f2f4f7;
    --link: #58a6ff;
    --muted: #9aa1aa;
    --rule: #30343b;
    --code-bg: #0e1013;
    --code-text: #e6edf3;
    --code-border: #2a2e35;
    --code-shadow: none;
    --table-border: #30343b;
    --th-bg: #24272d;
    --img-border: #30343b;

    --btn-text: #b8bec6;
    --btn-bg: rgba(30, 33, 38, .92);
    --btn-border: #3a3f47;
    --btn-hover-text: #ffffff;
    --btn-hover-bg: #2a2e35;
    --btn-hover-border: #59606b;
    --ok-text: #3fb950;
    --ok-bg: rgba(46, 160, 67, .15);
    --ok-border: #2ea043;
    --focus: #58a6ff;
  }

  /* ---------------------------------------------------------------------
     Slate overrides (driven by the tokens above)
     --------------------------------------------------------------------- */
  body { color: var(--text); }
  #main_content_wrap { background: var(--content-bg); transition: background-color .25s ease; }
  #main_content h1, #main_content h2, #main_content h3,
  #main_content h4, #main_content h5, #main_content h6 { color: var(--heading); }
  #main_content a { color: var(--link); }
  blockquote { color: var(--muted); border-left-color: var(--rule); }

  pre, code { color: var(--code-text); background-color: var(--code-bg); }
  pre { border: 1px solid var(--code-border); box-shadow: var(--code-shadow); }
  code { box-shadow: var(--code-shadow); }
  pre code { border: 0; background: transparent; }

  /* Drop Rouge's #f8f8f8 block background; the <pre> background shows instead. */
  .highlight { background-color: transparent; }
  pre.highlight { background-color: var(--code-bg); }
  /* Rouge flags valid HCL like `virtualization-type` as an error; don't box it. */
  .highlight .err { color: inherit; background-color: transparent; }

  table, td { border-color: var(--table-border); }
  th { background: var(--th-bg); }
  img { border-color: var(--img-border); box-shadow: none; }

  :root[data-theme="dark"] #main_content h2 {
    background: none;
    border-bottom: 1px solid var(--rule);
  }
  :root[data-theme="dark"] hr { background: var(--rule); }
  :root[data-theme="dark"] kbd {
    color: #e6edf3; background-color: #24272d;
    border-color: #3a3f47; box-shadow: inset 0 -1px 0 #3a3f47;
  }

  /* Dark syntax highlighting (GitHub Dark-inspired) */
  :root[data-theme="dark"] .highlight .c,
  :root[data-theme="dark"] .highlight .cm,
  :root[data-theme="dark"] .highlight .c1,
  :root[data-theme="dark"] .highlight .cd,
  :root[data-theme="dark"] .highlight .cs,
  :root[data-theme="dark"] .highlight .cp { color: #8b949e; }
  :root[data-theme="dark"] .highlight .k,
  :root[data-theme="dark"] .highlight .kc,
  :root[data-theme="dark"] .highlight .kd,
  :root[data-theme="dark"] .highlight .kn,
  :root[data-theme="dark"] .highlight .kp,
  :root[data-theme="dark"] .highlight .kr,
  :root[data-theme="dark"] .highlight .ow { color: #ff7b72; }
  :root[data-theme="dark"] .highlight .kt,
  :root[data-theme="dark"] .highlight .nc,
  :root[data-theme="dark"] .highlight .ne,
  :root[data-theme="dark"] .highlight .nn { color: #ffa657; }
  :root[data-theme="dark"] .highlight .s,
  :root[data-theme="dark"] .highlight .s1,
  :root[data-theme="dark"] .highlight .s2,
  :root[data-theme="dark"] .highlight .sb,
  :root[data-theme="dark"] .highlight .sc,
  :root[data-theme="dark"] .highlight .sd,
  :root[data-theme="dark"] .highlight .se,
  :root[data-theme="dark"] .highlight .sh,
  :root[data-theme="dark"] .highlight .si,
  :root[data-theme="dark"] .highlight .sx,
  :root[data-theme="dark"] .highlight .sr,
  :root[data-theme="dark"] .highlight .ss { color: #a5d6ff; }
  :root[data-theme="dark"] .highlight .m,
  :root[data-theme="dark"] .highlight .mi,
  :root[data-theme="dark"] .highlight .mf,
  :root[data-theme="dark"] .highlight .mh,
  :root[data-theme="dark"] .highlight .mo,
  :root[data-theme="dark"] .highlight .il,
  :root[data-theme="dark"] .highlight .no,
  :root[data-theme="dark"] .highlight .nb,
  :root[data-theme="dark"] .highlight .bp { color: #79c0ff; }
  :root[data-theme="dark"] .highlight .nf,
  :root[data-theme="dark"] .highlight .nd,
  :root[data-theme="dark"] .highlight .na { color: #d2a8ff; }
  :root[data-theme="dark"] .highlight .nt { color: #7ee787; }
  :root[data-theme="dark"] .highlight .nv,
  :root[data-theme="dark"] .highlight .vc,
  :root[data-theme="dark"] .highlight .vg,
  :root[data-theme="dark"] .highlight .vi,
  :root[data-theme="dark"] .highlight .ni,
  :root[data-theme="dark"] .highlight .nl,
  :root[data-theme="dark"] .highlight .o,
  :root[data-theme="dark"] .highlight .p,
  :root[data-theme="dark"] .highlight .w { color: #e6edf3; }
  :root[data-theme="dark"] .highlight .err { color: #ffa198; background-color: transparent; }
  :root[data-theme="dark"] .highlight .gd { color: #ffa198; background-color: rgba(248, 81, 73, .15); }
  :root[data-theme="dark"] .highlight .gi { color: #7ee787; background-color: rgba(46, 160, 67, .15); }
  :root[data-theme="dark"] .highlight .gh,
  :root[data-theme="dark"] .highlight .gu { color: #79c0ff; }
  :root[data-theme="dark"] .highlight .gp,
  :root[data-theme="dark"] .highlight .go { color: #8b949e; }
  :root[data-theme="dark"] .highlight .gr,
  :root[data-theme="dark"] .highlight .gt { color: #ffa198; }

  /* ---------------------------------------------------------------------
     Theme toggle (top-left of the header)
     --------------------------------------------------------------------- */
  .theme-toggle {
    position: absolute;
    top: 12px;
    left: 10px;
    z-index: 11;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    color: #e6e6e6;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 50%;
    cursor: pointer;
    transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); }
  .theme-toggle:active { transform: scale(.94); }
  .theme-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .theme-toggle svg { width: 17px; height: 17px; transition: transform .35s ease; }
  .theme-toggle:hover svg { transform: rotate(20deg); }
  /* Show the icon of the theme you'd switch TO. */
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }

  /* ---------------------------------------------------------------------
     Copy button on code blocks
     --------------------------------------------------------------------- */
  .code-copy-wrap { position: relative; }
  .code-copy-wrap pre { padding-right: 76px; }

  .code-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    font: 600 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    letter-spacing: .02em;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity .18s ease, transform .18s ease, color .18s ease,
                border-color .18s ease, background-color .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .code-copy-wrap:hover .code-copy-btn,
  .code-copy-btn:focus-visible,
  .code-copy-btn.is-copied {
    opacity: 1;
    transform: translateY(0);
  }
  .code-copy-btn:hover { color: var(--btn-hover-text); border-color: var(--btn-hover-border); background: var(--btn-hover-bg); }
  .code-copy-btn:active { transform: scale(.96); }
  .code-copy-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .code-copy-btn svg { width: 13px; height: 13px; flex: none; }
  .code-copy-btn .icon-check { display: none; }
  .code-copy-btn.is-copied { color: var(--ok-text); border-color: var(--ok-border); background: var(--ok-bg); }
  .code-copy-btn.is-copied .icon-copy { display: none; }
  .code-copy-btn.is-copied .icon-check { display: block; animation: code-copy-pop .28s ease-out; }

  @keyframes code-copy-pop {
    0%   { transform: scale(.5); opacity: 0; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* Touch screens have no hover: keep the button visible. */
  @media (hover: none) {
    .code-copy-btn { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .code-copy-btn, .code-copy-btn .icon-check, .theme-toggle, .theme-toggle svg,
    #main_content_wrap { transition: none; animation: none; }
  }
  @media print {
    .code-copy-btn, .theme-toggle { display: none; }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var root = document.documentElement;

    /* ---- Theme toggle ---- */
    var header = document.querySelector("#header_wrap .inner");
    if (header) {
      var toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "theme-toggle";
      toggle.innerHTML =
        '<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' +
        '<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

      var label = function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        toggle.setAttribute("aria-label", "Switch to " + next + " theme");
        toggle.title = "Switch to " + next + " theme";
      };
      label();

      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("site-theme", next); } catch (e) {}
        label();
      });

      header.appendChild(toggle);
    }

    /* ---- Copy buttons ---- */
    var COPY_ICON =
      '<svg class="icon-copy" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path fill="currentColor" d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
    var CHECK_ICON =
      '<svg class="icon-check" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      // Fallback for older browsers / non-HTTPS previews.
      return new Promise(function (resolve, reject) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy") ? resolve() : reject(); }
        catch (e) { reject(e); }
        finally { document.body.removeChild(ta); }
      });
    }

    document.querySelectorAll("pre").forEach(function (pre) {
      // Wrap the outermost highlight container (or the bare <pre>) so the
      // button stays pinned while long lines scroll horizontally.
      var host = pre.closest("div.highlighter-rouge") || pre;
      if (host.parentElement && host.parentElement.classList.contains("code-copy-wrap")) return;

      var wrap = document.createElement("div");
      wrap.className = "code-copy-wrap";
      host.parentNode.insertBefore(wrap, host);
      wrap.appendChild(host);

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "code-copy-btn";
      btn.setAttribute("aria-label", "Copy code to clipboard");
      btn.innerHTML = COPY_ICON + CHECK_ICON + '<span class="code-copy-label">Copy</span>';
      var label = btn.querySelector(".code-copy-label");
      var timer;

      btn.addEventListener("click", function () {
        var code = pre.querySelector("code") || pre;
        copyText(code.innerText.replace(/\n$/, "")).then(function () {
          btn.classList.add("is-copied");
          label.textContent = "Copied";
          btn.setAttribute("aria-label", "Copied");
        }, function () {
          label.textContent = "Press Ctrl+C";
        });
        clearTimeout(timer);
        timer = setTimeout(function () {
          btn.classList.remove("is-copied");
          label.textContent = "Copy";
          btn.setAttribute("aria-label", "Copy code to clipboard");
        }, 1800);
      });

      wrap.appendChild(btn);
    });
  });
</script>
